name: Trafik Veri Toplama

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kütüphaneyi kur
        run: pip install requests

      - name: Veri topla
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python trafik_veri_toplayici.py

      - name: CSV'yi depoya kaydet (commit + push)
        run: |
          git config user.name "trafik-bot"
          git config user.email "trafik-bot@users.noreply.github.com"
          git add istanbul_trafik_verisi.csv
          git diff --quiet --cached || git commit -m "trafik verisi güncellendi"
          git push
